<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Contract Reviews — Coming Soon</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #f7f5f1; --ink: #1f2a33; --muted: #5b6770; --accent: #2f5d62; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151a1e; --ink: #e8ecef; --muted: #9aa6ae; --accent: #7fb3b8; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .75rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    .tag { display: inline-block; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
           border: 1px solid currentColor; border-radius: 999px; padding: .2rem .75rem; margin-bottom: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Coming soon</span>
    <h1>Free review of your funeral, cemetery or preneed contract</h1>
    <p>We're building a service where a contract reviewer goes through your contract line by line and tells you what looks fair, what doesn't, and what to ask about — at no cost.</p>
    <p>Please check back soon.</p>
  </main>
</body>
</html>
